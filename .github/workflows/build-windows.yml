# Stephender — Windows build (DRAFT, to be validated by the Phase 0 zero-patch baseline run)
# Builds Blender 5.2.4 LTS from source + applies patches/*.patch, one at a time.
# Free GitHub Actions runner: windows-2022, 4 vCPU, 16 GB RAM, MSVC 2022.
# This is the build that runs on the ThinkPad T460 — built from Phase 0, not Phase 5.
# Delivery: GitHub Releases (no tunnels, no browser downloads).
name: Build Stephender (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
    steps:
      - name: Check out stephender repo
        uses: actions/checkout@v4

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Subversion + sccache
        run: |
          choco install svn -y
          choco install sccache -y
          if (-not (Get-Command svn -ErrorAction SilentlyContinue) -and (Test-Path "C:\Program Files (x86)\Subversion\bin")) {
            Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\Subversion\bin" -Encoding ascii
          }
        shell: powershell

      - name: Restore sccache
        uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-windows-${{ hashFiles('patches/*.patch') }}
          restore-keys: |
            sccache-windows-

      - name: Clone Blender v5.2.4 (shallow)
        run: git clone --depth 1 --branch v5.2.4 https://projects.blender.org/blender/blender.git blender-source

      - name: Pre-seed Windows prebuilt libraries
        working-directory: blender-source
        shell: cmd
        run: |
          git lfs install --skip-repo || exit /b 1
          git config --local submodule.lib/windows_x64.update checkout || exit /b 1
          set GIT_LFS_SKIP_SMUDGE=1
          git submodule update --progress --init lib/windows_x64 || exit /b 1
          set GIT_LFS_SKIP_SMUDGE=
          git -C lib/windows_x64 lfs pull || exit /b 1

      - name: Get prebuilt libraries
        working-directory: blender-source
        run: make update
        shell: cmd

      - name: Apply Stephender patches
        working-directory: blender-source
        shell: powershell
        run: |
          $patches = Get-ChildItem ..\patches\*.patch -ErrorAction SilentlyContinue | Sort-Object Name
          foreach ($p in $patches) {
            Write-Host "Applying $($p.Name)"
            git apply --check $p.FullName; if ($LASTEXITCODE -ne 0) { exit 1 }
            git apply $p.FullName; if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          if (-not $patches) { Write-Host "No patches to apply (zero-patch baseline)." }
          git status --short

      - name: Configure and build (Release, sccache, Ninja)
        working-directory: blender-source
        shell: cmd
        run: |
          make 2022 ninja sccache

      - name: Smoke test the build
        working-directory: blender-source
        shell: cmd
        run: |
          ..\build_windows_x64_vc17_Release\bin\blender.exe --version
          ..\build_windows_x64_vc17_Release\bin\blender.exe --background --factory-startup --python-expr "import bpy; print('objects:', len(bpy.data.objects)); print('undo_mem_limit:', bpy.context.preferences.edit.undo_memory_limit)"

      # Stephender: measure the REAL Windows startup working set on the
      # runner (no Windows machine exists on Muse's side). Keeps Blender
      # alive ~12s with a sleeping python expr, samples WorkingSet64,
      # reports the OS-tracked PeakWorkingSet64, and lists whether the
      # /DELAYLOAD DLLs are actually loaded at startup. Measurement only
      # — a failure here never fails the build.
      - name: Measure Windows startup working set
        working-directory: blender-source
        shell: powershell
        run: |
          try {
            $exe = "..\build_windows_x64_vc17_Release\bin\blender.exe"
            $p = Start-Process -FilePath $exe -ArgumentList '--background','--factory-startup','--python-expr','import time; time.sleep(12)' -PassThru -NoNewWindow
            $peakSampled = 0
            $mods = @()
            for ($i = 0; $i -lt 13; $i++) {
              Start-Sleep -Seconds 1
              $p.Refresh()
              if ($p.HasExited) { break }
              try { if ($p.WorkingSet64 -gt $peakSampled) { $peakSampled = $p.WorkingSet64 } } catch { }
              if ($i -eq 3) {
                try { $mods = (Get-Process -Id $p.Id -ErrorAction Stop).Modules | Select-Object -ExpandProperty ModuleName } catch { $mods = @() }
              }
            }
            $p.Refresh()
            $peakOs = 0
            try { $peakOs = $p.PeakWorkingSet64 } catch { }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Write-Output "STEPHENDER-WIN-STARTUP-WS-SAMPLED-MB=$([math]::Round($peakSampled/1MB,1))"
            Write-Output "STEPHENDER-WIN-STARTUP-WS-PEAK-MB=$([math]::Round($peakOs/1MB,1))"
            foreach ($dll in @('OpenImageDenoise.dll','oslcomp.dll','oslexec.dll','oslquery.dll','embree4.dll','usd_ms.dll','openvdb.dll')) {
              Write-Output "STEPHENDER-WIN-MODULE $dll loaded=$($mods -contains $dll)"
            }
          } catch {
            Write-Output "STEPHENDER-WIN-STARTUP-MEASURE-FAILED: $($_.Exception.Message)"
          }

      - name: Regression test — Blender bl_global_undo.py
        working-directory: blender-source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ..\test-out\global_undo | Out-Null
          ..\build_windows_x64_vc17_Release\bin\blender.exe --background --factory-startup --python-exit-code 1 `
            --python tests\python\bl_global_undo.py -- `
            --src-test-dir tests `
            --output-dir ..\test-out\global_undo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Regression test — undo_runtime_test.py
        working-directory: blender-source
        shell: powershell
        run: |
          ..\build_windows_x64_vc17_Release\bin\blender.exe --background --factory-startup --python-exit-code 1 `
            --python ..\bench\undo_runtime_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cache BMW27 regression scene
        uses: actions/cache@v4
        with:
          path: .ci-scenes
          key: bmw27-scene-v1

      - name: Regression test — BMW27 64-sample smoke render
        working-directory: blender-source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ..\.ci-scenes | Out-Null
          if (-not (Test-Path ..\.ci-scenes\BMW27.blend)) {
            Invoke-WebRequest -Uri https://download.blender.org/demo/test/BMW27.blend.zip -OutFile ..\.ci-scenes\BMW27.blend.zip
            Expand-Archive -Path ..\.ci-scenes\BMW27.blend.zip -DestinationPath ..\.ci-scenes -Force
            Remove-Item -Force ..\.ci-scenes\BMW27.blend.zip
            Remove-Item -Recurse -Force ..\.ci-scenes\__MACOSX -ErrorAction SilentlyContinue
          }
          ..\build_windows_x64_vc17_Release\bin\blender.exe --background --factory-startup --python-exit-code 1 `
            --python ..\bench\post_render_rss.py -- `
            --scene ..\.ci-scenes\BMW27.blend --samples 64 --wait 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        working-directory: blender-source
        shell: powershell
        run: |
          $bin = "..\build_windows_x64_vc17_Release\bin"

          # Stephender Phase 2 Fix 5: ship blender.pdb as a separate debug asset
          # instead of bundling ~134 MiB of symbols inside the main user zip.
          $pdb = Join-Path $bin "blender.pdb"
          if (Test-Path $pdb) {
            Compress-Archive -Path $pdb -DestinationPath stephender-windows-x64-pdb.zip -Force
            (Get-FileHash stephender-windows-x64-pdb.zip -Algorithm SHA256).Hash | Out-File stephender-windows-x64-pdb.zip.sha256
            Get-ChildItem stephender-windows-x64-pdb.zip | Select-Object Name, Length
          }

          # Remove non-runtime build-time host tools and debug/linker artifacts from bin\.
          # These leak into bin\ because Ninja's EXECUTABLE_OUTPUT_PATH matches CMAKE_INSTALL_PREFIX.
          # Preserves blender.shared\, blender.crt\, 5.2\ (incl. any Cycles GPU kernels), and all runtime DLLs/EXEs.
          $topJunk = @(
            "*.pdb",
            "*.lib",
            "*.exp",
            "makesrna.exe",
            "makesdna.exe",
            "msgfmt.exe",
            "datatoc.exe",
            "shader_tool.exe",
            "zstd_compress.exe"
          )
          foreach ($pat in $topJunk) {
            Get-ChildItem -Path $bin -Filter $pat -File -ErrorAction SilentlyContinue | Remove-Item -Force
          }

          # Belt-and-suspenders guard in case any .pdb remains under bundled Python
          # (already excluded by CMake install rules in 0006-packaging-trim.patch).
          Get-ChildItem -Path (Join-Path $bin "5.2\python") -Filter "*.pdb" -Recurse -File -ErrorAction SilentlyContinue | Remove-Item -Force

          # Post-trim smoke check and uncompressed size report.
          $env:PYTHONDONTWRITEBYTECODE = "1"
          & (Join-Path $bin "blender.exe") --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uncompressedBytes = (Get-ChildItem -Path $bin -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Output "STEPHENDER-WIN-UNCOMPRESSED-BYTES=$uncompressedBytes ($([math]::Round($uncompressedBytes/1MB,1)) MiB)"

          Compress-Archive -Path "$bin\*" -DestinationPath stephender-windows-x64.zip -Force
          (Get-FileHash stephender-windows-x64.zip -Algorithm SHA256).Hash | Out-File stephender-windows-x64.zip.sha256
          Get-ChildItem stephender-windows-x64.zip | Select-Object Name, Length

      - name: Upload build artifact (kept 30 days)
        uses: actions/upload-artifact@v4
        with:
          name: stephender-windows-x64
          path: |
            blender-source/stephender-windows-x64.zip
            blender-source/stephender-windows-x64.zip.sha256
          retention-days: 30

      - name: Upload debug symbols artifact (kept 30 days)
        uses: actions/upload-artifact@v4
        with:
          name: stephender-windows-x64-pdb
          path: |
            blender-source/stephender-windows-x64-pdb.zip
            blender-source/stephender-windows-x64-pdb.zip.sha256
          retention-days: 30
          if-no-files-found: ignore

      # Publishing to a GitHub Release happens on release events only.
      - name: Publish to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            blender-source/stephender-windows-x64.zip
            blender-source/stephender-windows-x64.zip.sha256
            blender-source/stephender-windows-x64-pdb.zip
            blender-source/stephender-windows-x64-pdb.zip.sha256
